theme = "nordic"

[editor]
clipboard-provider = "pasteboard"
default-yank-register = "+"
trim-trailing-whitespace = true
bufferline = "multiple"

[editor.whitespace]
render = "all"

[editor.soft-wrap]
enable = false

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 1000

[editor.indent-guides]
render = true

[keys.normal]
"A-z" = ":toggle soft-wrap.enable"

[keys.insert]
"C-[" = "normal_mode"
# Emacs-like bindings
"C-a" = "goto_line_start"
"C-e" = "goto_line_end_newline"
"C-f" = "move_char_right"
"C-b" = "move_char_left"
"A-f" = "move_next_word_end"
"A-b" = "move_prev_word_start"
"C-p" = "move_line_up"
"C-n" = "move_line_down"
