# noslop のユーザーの設定 (~/.config/noslop/config.toml)
#
# このマシンでは、どのディレクトリで実行してもこのファイルを読みます。
# プロジェクトの設定 (noslop.toml) に書いた項目はそちらが優先され、CLI で指定した値はさらに優先されます。
# 書き方はプロジェクトの設定と同じです。どの項目も、書かなければ既定値が使われます。
# 手元のマシンでだけ使う設定 (辞書の選び方や、手元で止めたいルールなど) を書いてください。

# 文書のジャンル: general / tech / business / essay (別名 blog / minutes)
# genre = "general"

[morphology]
# 形態素解析の辞書 (P15・P16 を品詞で判定する)
#   auto (既定): HASAMI_DICT → hasami の share ディレクトリ (既定は ~/.local/share/hasami) の辞書を
#                推奨順 (ipadic-neologd-sudachi → ipadic-neologd → ipadic) → 同梱の IPAdic
#   bundled: 同梱の IPAdic (P15・P16 を校正した辞書)
#   share:<名前>: noslop dict download <名前> で取得した辞書
#   ファイルのパス (相対パスはこのファイルのあるディレクトリ基準、~/ はホームディレクトリ)
# dictionary = "auto"

[rules]
# 手元で止めるルール・動かすルール (プロジェクトの設定で触れたルールは、そちらに従います)
# disable = ["R03"]
# enable = ["P04"]
# 箇条書きの割合 (S02) は、箇条書きの多い文書を好むため止める
disable = ["S02"]

[files]
# 検査する文書の拡張子 (既定は次のすべて)。プロジェクトの設定に extensions があれば、こちらは使いません
# extensions = ["md", "markdown", "txt"]
# 除外するパス (.gitignore と同じ書式)。ユーザーの設定では、noslop check に渡したディレクトリが基準です。
# プロジェクトの設定に exclude があれば、こちらは使いません
# exclude = ["drafts/"]

[code]
# 静的な文字列・JSX/HTML の文言も読む (既定)。false ならコメントと Python の docstring だけ。
# static_text = true
# コードの文言を検査する拡張子 (フックと、ディレクトリをたどるときに集める。既定は空)。
# プロジェクトの設定に extensions があれば、こちらは使いません。
# 次は noslop がコメントを読めるすべての拡張子です。使うものだけを残して、行頭の # を外してください
# extensions = [
#   "rs",                                    # Rust
#   "js", "mjs", "cjs", "jsx",               # JavaScript
#   "ts", "mts", "cts",                      # TypeScript
#   "tsx",                                   # TSX
#   "py", "pyi",                             # Python
#   "go",                                    # Go
#   "java",                                  # Java
#   "c", "h",                                # C
#   "cc", "cpp", "cxx", "hh", "hpp", "hxx",  # C++
#   "cs",                                    # C#
#   "rb",                                    # Ruby
#   "php",                                   # PHP
#   "swift",                                 # Swift
#   "kt", "kts",                             # Kotlin
#   "sh", "bash", "zsh",                     # Bash
#   "yaml", "yml",                           # YAML
#   "toml",                                  # TOML
#   "html", "htm",                           # HTML
#   "css",                                   # CSS
#   "lua",                                   # Lua
# ]

# 手元で使う独自ルール (プロジェクトの設定に同じ ID があれば、そちらで置き換わります)
# [[custom]]
# id = "X01"
# name = "BANNED_TERM"
# pattern = "ユーザー様"
# message = "「ユーザー様」ではなく「利用者」と書きます"
# severity = "warning"

# 直訳造語の辞書。id が JA で始まる [[custom]] は、omp の拡張 japanese-writing-hooks.ts が
# システムプロンプトの「使わない語」の一覧にも使う (name が NG 語、hint が言い換え)。
# 漢字で始まる語は、直前も漢字なら熟語の一部とみなして外す (「派生値」の「生値」など)。
# 「の直後にある語は言及とみなして外す (「生値」は外れ、「この生値」は外れない)。

# raw value の直訳
[[custom]]
id = "JA01"
name = "生値"
pattern = "(?:^|[^\\p{Han}「])生値"
regex = true
message = "直訳造語「生値」を使っている"
hint = "ハッシュ化前、暗号化前、エンコード前、入力されたままの値など、何をする前の値かを書く"
severity = "warning"

# bare/naked value の直訳
[[custom]]
id = "JA02"
name = "裸の値"
pattern = "(?:^|[^\\p{Han}「])裸の値"
regex = true
message = "直訳造語「裸の値」を使っている"
hint = "ラップしていない値、型変換前の値など、何をしていない値かを書く"
severity = "warning"

