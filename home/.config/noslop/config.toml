regex = true
message = "直訳造語「会員を引け」を使っている"
hint = "会員を取得できた、会員が見つかった"
severity = "warning"

# pair of login type の直訳
[[custom]]
id = "JA21"
name = "ログイン方法の組"
pattern = "(?:^|[^「])ログイン方法の組"
regex = true
message = "直訳造語「ログイン方法の組」を使っている"
hint = "ログイン方法とのタプル、ログイン方法とのペア"
severity = "warning"

# row（DBの1件）の直訳。「行う」「実行」や文章の行に当たらないよう、DBの文脈の形だけを検査する
[[custom]]
id = "JA22"
name = "DBの1件を指す「行」"
pattern = "(?:(?:^|[^「])(?:設定|ユーザープール|テナント|会員|DB|データベース|モデル)の?行(?:$|[^いうえおかきくけこっわ\\p{Han}])|(?:^|[^\\d\\p{Han}「])[1１一]行(?:で|ずつ|だけ)持|(?:^|[^\\p{Han}「])行を作)"
regex = true
message = "DBの1件を「行」と書いている"
hint = "レコード（例: 設定の行→設定のレコード、1行で持つ→1レコードで持つ、行を作らない→レコードを作らない）"
severity = "warning"

# marker / flag の直訳。目印・矢印・印刷・印象のような熟語に当たらないよう、前後が漢字でない「印」だけを検査する
[[custom]]
id = "JA23"
name = "マーカーを指す「印」"
pattern = "(?:^|[^\\p{Han}「])印(?:$|[^\\p{Han}」])"
regex = true
message = "marker・flagを「印」と訳している"
hint = "何が書かれているかを具体的に書く（例: 要確認の印が残っているメモリー→[要確認]と書いたメモリー、完了の印を付ける→完了と書く・完了フラグを立てる）"
severity = "warning"

# add の直訳。満足・補足・不足のような熟語と「足りる」に当たらないよう、前が漢字でない「足す」の活用形だけを検査する
[[custom]]
id = "JA24"
name = "足す"
pattern = "(?:^|[^\\p{Han}「])足[さしすせそ]"
regex = true
message = "「足す」を使っている"
hint = "加える、追加する"
severity = "warning"

# timing の訳語として見慣れない語。同時機能・臨時機関のような別の熟語に当たらないよう、前後が漢字でない「時機」だけを検査する
[[custom]]
id = "JA25"
name = "時機"
pattern = "(?:^|[^\\p{Han}「])時機(?:$|[^\\p{Han}」])"
regex = true
message = "見慣れない語「時機」を使っている"
hint = "タイミング"
severity = "warning"

# 長音の表記。「リポジトリ」「ディレクトリ」「フォルダ」と長音なしで書く
[[custom]]
id = "JA26"
name = "リポジトリー"
pattern = "(?:^|[^「])リポジトリー"
regex = true
message = "「リポジトリー」と長音付きで書いている"
hint = "リポジトリ"
severity = "warning"

[[custom]]
id = "JA27"
name = "ディレクトリー"
pattern = "(?:^|[^「])ディレクトリー"
regex = true
message = "「ディレクトリー」と長音付きで書いている"
hint = "ディレクトリ"
severity = "warning"

[[custom]]
id = "JA28"
name = "フォルダー"
pattern = "(?:^|[^「])フォルダー"
regex = true
message = "「フォルダー」と長音付きで書いている"
hint = "フォルダ"
severity = "warning"

# 人が読む資料では response を「応答」と訳さない。自動応答・無応答のような熟語に当たらないよう、前が漢字でない「応答」だけを検査する
[[custom]]
id = "JA29"
name = "応答"
pattern = "(?:^|[^\\p{Han}「])応答(?:$|[^」])"
regex = true
message = "「応答」と書いている"
hint = "レスポンス"
severity = "warning"
